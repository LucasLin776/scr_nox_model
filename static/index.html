<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCR 脱硝建模与控制</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--bg:#08121f;--card:#102235;--card2:#132b43;--text:#e9f1f8;--muted:#9db3c8;--accent:#36c2a6;--warn:#f6bd60;--line:#23415c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#08121f,#0e2033);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--text)}header{padding:28px 5vw 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:28px;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}p{color:var(--muted);margin:6px 0;font-size:13px}.badge{background:rgba(54,194,166,.13);color:var(--accent);border:1px solid rgba(54,194,166,.35);padding:8px 12px;border-radius:99px;font-size:12px}.wrap{max-width:1400px;margin:auto;padding:20px 5vw 36px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:rgba(16,34,53,.88);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14)}.card{padding:16px}.label{font-size:12px;color:var(--muted)}.value{font-size:25px;font-weight:700;margin-top:8px}.unit{font-size:12px;color:var(--muted);margin-left:4px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{padding:16px;margin-bottom:16px}.plot{height:350px}.smallplot{height:330px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-weight:500}.control{display:grid;grid-template-columns:1fr 1fr;gap:14px}.control-box{background:var(--card2);padding:14px;border-radius:10px}.control-box strong{font-size:22px;color:var(--accent)}button{background:var(--accent);color:#05201b;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.secondary{background:#24435c;color:var(--text)}textarea,input{background:#091a2b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%}textarea{min-height:70px;resize:vertical}.answer{white-space:pre-wrap;line-height:1.6;color:#d7e6f1;font-size:13px;margin-top:12px}.foot{color:var(--muted);font-size:12px;text-align:center;padding:15px}.err{color:#ff9f9f}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.two,.control{grid-template-columns:1fr}.plot,.smallplot{height:300px}}
</style></head><body><header><div><h1>SCR 脱硝过程数据驱动建模与控制</h1><p>600 MW 机组 · 10 s 聚合 · 随机森林 + GRU 时序通道 · 约束喷氨优化</p></div><span class="badge" id="status">正在读取模型</span></header><main class="wrap"><section class="cards" id="cards"></section><section class="grid"><div><div class="panel"><h2>尾部烟道出口 NOx 趋势</h2><div id="trend" class="plot"></div></div><div class="panel"><h2>A/B 侧入口、出口与喷氨量</h2><div id="sides" class="plot"></div></div></div><div><div class="panel"><h2>测试集预测对比</h2><div id="scatter" class="smallplot"></div></div><div class="panel"><h2>模型变量重要性</h2><div id="importance" class="smallplot"></div></div></div></section><section class="panel"><h2>约束喷氨优化（离线建议）</h2><div class="control"><div class="control-box" id="current"></div><div class="control-box" id="recommend"></div></div><p>默认约束：预测尾部 NOx ≤ 设定值 + 2 mg/Nm³，喷氨流量为当前值的 0.80–1.20 倍。正式投运前需要现场标定氨逃逸、阀门速率和联锁条件。</p></section><section class="panel"><h2>DeepSeek 辅助分析</h2><textarea id="question">请根据当前模型指标、变量重要性和控制推荐，给出三条运行分析建议，并标明哪些结论需要现场确认。</textarea><div style="margin-top:10px;display:flex;gap:10px"><button onclick="ask()">调用 DeepSeek API</button><button class="secondary" onclick="document.getElementById('question').value='解释当前模型为什么使用历史 NOx 和 A/B 侧出口 NOx 特征。'">填入示例问题</button></div><div id="answer" class="answer"></div></section><section class="panel"><h2>数据质量与模型结果</h2><div id="details"></div></section><div class="foot">数值计算与控制优化在本地后端完成；DeepSeek 只接收统计摘要和模型结果，不接收原始逐秒数据。</div></main><script>
const layout={paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#dbe9f5'},margin:{l:48,r:18,t:12,b:40},xaxis:{gridcolor:'#23415c'},yaxis:{gridcolor:'#23415c'},legend:{orientation:'h',y:1.1}};
function fmt(v,n=2){return Number(v).toFixed(n)}
async function load(){const r=await fetch('/api/summary');const d=await r.json();window.data=d;document.getElementById('status').textContent='模型已加载 · '+d.metadata.best_tree_model;const m=d.metrics;const cards=[['测试集 RMSE',fmt(m.random_forest.test.RMSE),'mg/Nm³'],['测试集 MAE',fmt(m.random_forest.test.MAE),'mg/Nm³'],['测试集 R²',fmt(m.random_forest.test.R2,4),''],['清洗后样本',d.metadata.clean_rows.toLocaleString(),'个 10 s 样本'],['数据有效率',fmt(d.metadata.valid_fraction*100,2),'%']];document.getElementById('cards').innerHTML=cards.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}<span class="unit">${x[2]}</span></div></div>`).join('');const s=d.series;const x=s.map(a=>a.dt);Plotly.newPlot('trend',[{x,y:s.map(a=>a.tail_nox),name:'尾部 NOx',line:{color:'#36c2a6',width:2}},{x,y:s.map(a=>a.setpoint),name:'设定值',line:{color:'#f6bd60',dash:'dash'}}],layout);Plotly.newPlot('sides',[{x,y:s.map(a=>a.noin_a),name:'A入口',line:{color:'#f6bd60'}},{x,y:s.map(a=>a.noout_a),name:'A出口',line:{color:'#36c2a6'}},{x,y:s.map(a=>a.noin_b),name:'B入口',line:{color:'#e98eae'}},{x,y:s.map(a=>a.noout_b),name:'B出口',line:{color:'#8ec5ff'}}],layout);const q=await fetch('/artifacts/ensemble_test_predictions.csv').then(r=>r.text());const rows=q.trim().split('\n').slice(1).map(r=>r.split(','));Plotly.newPlot('scatter',[{x:rows.map(r=>+r[1]),y:rows.map(r=>+r[2]),mode:'markers',name:'随机森林',marker:{color:'#36c2a6',size:4,opacity:.55}},{x:[0,100],y:[0,100],mode:'lines',name:'理想线',line:{color:'#f6bd60',dash:'dash'}}],{...layout,xaxis:{title:'实际 NOx',gridcolor:'#23415c'},yaxis:{title:'预测 NOx',gridcolor:'#23415c'}});const im=d.importance.slice(0,12).reverse();Plotly.newPlot('importance',[{x:im.map(a=>a.importance),y:im.map(a=>a.feature),type:'bar',orientation:'h',marker:{color:'#36c2a6'}}],{...layout,margin:{l:160,r:18,t:12,b:35},xaxis:{title:'置换重要性',gridcolor:'#23415c'}});const c=d.control;document.getElementById('current').innerHTML=`<div class="label">当前工况</div><p>${c.current.dt} · 负荷 ${fmt(c.current.load_mw,1)} MW</p><p>当前 A/B 氨流量：${fmt(c.current.nh3_a,1)} / ${fmt(c.current.nh3_b,1)} kg/h</p><strong>${fmt(c.current.predicted_tail_nox,2)} <span class="unit">mg/Nm³ 预测 NOx</span></strong>`;document.getElementById('recommend').innerHTML=`<div class="label">推荐喷氨</div><p>A/B 倍率：${fmt(c.recommendation.mult_a,2)} / ${fmt(c.recommendation.mult_b,2)}</p><p>推荐 A/B：${fmt(c.recommendation.nh3_a,1)} / ${fmt(c.recommendation.nh3_b,1)} kg/h</p><strong>${fmt(c.recommendation.pred_tail_nox,2)} <span class="unit">mg/Nm³ 预测 NOx</span></strong>`;document.getElementById('details').innerHTML=`<table class="table"><tr><th>项目</th><th>结果</th></tr><tr><td>原始记录</td><td>${d.quality.raw_rows.toLocaleString()} 行，${fmt(d.quality.duration_hours,1)} 小时</td></tr><tr><td>分析仪上限哨兵值</td><td>尾部 ${d.quality.sentinel_counts.tail_327_67.toLocaleString()} 行；A/B 出口分别 ${d.quality.sentinel_counts.noout_a_327_67.toLocaleString()} / ${d.quality.sentinel_counts.noout_b_327_67.toLocaleString()} 行</td></tr><tr><td>GRU 测试 RMSE</td><td>${fmt(d.metrics.gru.test.RMSE)} mg/Nm³</td></tr><tr><td>95/5 融合测试 RMSE</td><td>${fmt(d.metrics.fusion_95rf_05gru.test.RMSE)} mg/Nm³</td></tr></table>`}
async function ask(){const answer=document.getElementById('answer');answer.textContent='正在调用…';const r=await fetch('/api/deepseek',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.getElementById('question').value})});const d=await r.json();answer.textContent=d.answer||d.message||d.fallback||'无返回';}
load().catch(e=>{document.getElementById('status').textContent='加载失败';document.getElementById('status').className='badge err';console.error(e)});
</script></body></html>
